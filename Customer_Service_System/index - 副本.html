<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番客知溯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #fff;
            padding: 16px 24px;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 18px;
        }
        .header h1 { font-size: 16px; color: #333; }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        .message.user { flex-direction: row-reverse; }
        .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: white;
        }
        .avatar.bot {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .avatar.user {
            background: #1890ff;
        }
        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
        }
        .message.bot .bubble {
            background: #fff;
            color: #333;
            border: 1px solid #e8e8e8;
        }
        .message.user .bubble {
            background: #1890ff;
            color: #fff;
        }
        .suggested-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .suggested-questions button {
            padding: 8px 16px;
            border: 1px solid #d9d9d9;
            background: #fff;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            color: #1890ff;
            transition: all 0.2s;
        }
        .suggested-questions button:hover {
            border-color: #1890ff;
            background: #e6f7ff;
        }
        .input-area {
            background: #fff;
            border-top: 1px solid #e8e8e8;
            padding: 16px 24px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .input-wrapper textarea {
            flex: 1;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
        }
        .input-wrapper textarea:focus {
            border-color: #1890ff;
        }
        .send-btn {
            width: 44px; height: 44px;
            background: #1890ff;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .send-btn:hover { background: #40a9ff; }
        .send-btn:disabled { background: #bfbfbf; cursor: not-allowed; }
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }
        .typing span {
            width: 8px; height: 8px;
            background: #bfbfbf;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-icon">🤖</div>
        <h1>华侨知识专属回答小助手</h1>
    </div>
    
    <div class="chat-container" id="chatContainer">
        <!-- 欢迎消息 -->
        <div class="message bot">
            <div class="avatar bot">🤖</div>
            <div>
                <div class="bubble">
                    你好，我是华侨知识专属回答小助手！我可以为你解答华侨历史、侨批文化、海外会馆、侨乡政策、华工发展史、华侨代表人物等相关问题，有什么想问的尽管提问吧~
                </div>
                <div class="suggested-questions">
                    <button onclick="sendQuestion('华侨和华人有什么区别？')">华侨和华人有什么区别？</button>
                    <button onclick="sendQuestion('猪仔馆是什么？')">猪仔馆是什么？</button>
                    <button onclick="sendQuestion('什么是侨批？')">什么是侨批？</button>
                    <button onclick="sendQuestion('海外华侨会馆有什么作用？')">海外华侨会馆有什么作用？</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="userInput" placeholder="和 知识库 + 聊天机器人 聊天" rows="1"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const API_KEY = 'app-IHEAlIb5wSI0xqgQxXbGRJv6';  // 替换为你的 Dify API Key
        const API_URL = 'https://api.dify.ai/v1/chat-messages';
        let conversationId = '';
        let isStreaming = false;

        // 固定当前浏览器会话的用户 ID，避免 conversation_id 与用户不匹配导致 404
        const USER_ID = 'web-user-' + Math.random().toString(36).slice(2);

        // 自动调整 textarea 高度
        const textarea = document.getElementById('userInput');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // 回车发送，Shift+回车换行
        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function sendQuestion(question) {
            document.getElementById('userInput').value = question;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const query = input.value.trim();
            if (!query || isStreaming) return;

            // 添加用户消息
            addMessage('user', query);
            input.value = '';
            input.style.height = 'auto';
            isStreaming = true;
            document.getElementById('sendBtn').disabled = true;

            // 添加打字指示器
            const typingId = addTypingIndicator();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        inputs: {},
                        query: query,
                        response_mode: 'streaming',
                        conversation_id: conversationId,
                        user: USER_ID
                    })
                });

                // 移除打字指示器
                removeTypingIndicator(typingId);

                if (!response.ok) {
                    throw new Error('API 请求失败');
                }

                // 处理 SSE 流式响应
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let botMessageId = addMessage('bot', '');
                let fullAnswer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            
                            try {
                                const parsed = JSON.parse(data);
                                console.log('Dify event:', parsed.event, parsed);

                                // 累加 message / agent_message 返回的文本片段
                                if ((parsed.event === 'message' || parsed.event === 'agent_message') && parsed.answer) {
                                    fullAnswer += parsed.answer;
                                    updateMessage(botMessageId, fullAnswer);
                                    if (parsed.conversation_id) {
                                        conversationId = parsed.conversation_id;
                                    }
                                }

                                // Workflow / Chatflow 应用在 workflow_finished 中给出最终答案
                                if (parsed.event === 'workflow_finished' && parsed.data?.outputs?.answer) {
                                    fullAnswer = parsed.data.outputs.answer;
                                    updateMessage(botMessageId, fullAnswer);
                                }
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }

            } catch (error) {
                removeTypingIndicator(typingId);
                addMessage('bot', '抱歉，发生了错误，请稍后重试。');
                console.error(error);
            } finally {
                isStreaming = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }

        function addMessage(role, content) {
            const container = document.getElementById('chatContainer');
            const id = 'msg-' + Date.now();
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.id = id;
            div.innerHTML = `
                <div class="avatar ${role}">${role === 'bot' ? '🤖' : '👤'}</div>
                <div class="bubble">${content}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function updateMessage(id, content) {
            const msg = document.getElementById(id);
            if (msg) {
                msg.querySelector('.bubble').textContent = content;
                const container = document.getElementById('chatContainer');
                container.scrollTop = container.scrollHeight;
            }
        }

        function addTypingIndicator() {
            const container = document.getElementById('chatContainer');
            const id = 'typing-' + Date.now();
            const div = document.createElement('div');
            div.className = 'message bot';
            div.id = id;
            div.innerHTML = `
                <div class="avatar bot">🤖</div>
                <div class="bubble typing">
                    <span></span><span></span><span></span>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
